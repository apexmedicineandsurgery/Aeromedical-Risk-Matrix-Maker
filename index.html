<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aeromedical Risk Analyzer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <i data-lucide="activity" class="w-8 h-8 text-blue-400"></i>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Aeromedical Risk Analyzer</h1>
                    <p class="text-xs text-slate-400">3D Matrix: Probability × Impact × Role</p>
                </div>
            </div>
            
            <div class="flex items-center bg-slate-800 rounded-lg p-1">
                <button onclick="app.setActiveTab('matrix')" id="tab-matrix" class="px-4 py-2 rounded-md text-sm font-medium transition-all bg-blue-600 text-white shadow-md">
                    Matrix View
                </button>
                <button onclick="app.setActiveTab('settings')" id="tab-settings" class="px-4 py-2 rounded-md text-sm font-medium transition-all text-slate-400 hover:text-white">
                    Configuration
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-container" class="max-w-7xl mx-auto p-4 md:p-6 w-full flex-grow">
        <!-- Content injected by JS -->
    </main>

    <!-- App Logic -->
    <script>
        // --- Data & State ---
        
        const DEFAULT_ROLES = [
            { id: 'fighter-pilot', name: 'Fighter Pilot' },
            { id: 'loadmaster', name: 'Loadmaster' },
        ];

        const DEFAULT_LIKELIHOODS = [
            { id: 'l1', label: 'Likely', subLabel: '> 2% per year' },
            { id: 'l2', label: 'Possible', subLabel: '1% - 2% per year' },
            { id: 'l3', label: 'Unlikely', subLabel: '0.5% - 1% per year' },
            { id: 'l4', label: 'Highly Unlikely', subLabel: '< 0.5% per year' },
        ];

        const DEFAULT_IMPACTS = [
            { 
                id: 'i1', 
                label: 'Class I', 
                missionImpact: 'No significant operational impact. Mission continues.', 
                medicalImpact: 'Symptom-free or easily controlled with self-medication.',
                crewImpact: 'No intervention required. Routine medical follow-up.'
            },
            { 
                id: 'i2', 
                label: 'Class II', 
                missionImpact: 'Minor degradation of mission effectiveness. Mission may continue modified.', 
                medicalImpact: 'Symptoms present but not incapacitating. Distraction possible.',
                crewImpact: 'Self-limiting or controlled by simple measures. Return to flight likely.'
            },
            { 
                id: 'i3', 
                label: 'Class III', 
                missionImpact: 'Major degradation of mission. Mission abort likely.', 
                medicalImpact: 'Significant performance impairment. Sudden onset possible.',
                crewImpact: 'Immediate medical attention may be required upon landing. Waiver required.'
            },
            { 
                id: 'i4', 
                label: 'Class IV', 
                missionImpact: 'Safety of flight compromised. Catastrophic mission failure possible.', 
                medicalImpact: 'Sudden or subtle incapacitation (e.g., seizure, syncope, MI).',
                crewImpact: 'Immediate aircrew intervention required to maintain control. Disqualification likely.'
            },
        ];

        const DEFAULT_RISK_MAP = {
            'fighter-pilot': {
                'l1': { 'i1': 'medium', 'i2': 'high',   'i3': 'high', 'i4': 'high' },
                'l2': { 'i1': 'medium', 'i2': 'medium', 'i3': 'high', 'i4': 'high' },
                'l3': { 'i1': 'low',    'i2': 'low',    'i3': 'medium', 'i4': 'medium' },
                'l4': { 'i1': 'low',    'i2': 'low',    'i3': 'low',    'i4': 'low' },
            },
            'loadmaster': {
                'l1': { 'i1': 'low',    'i2': 'medium', 'i3': 'high', 'i4': 'high' },
                'l2': { 'i1': 'low',    'i2': 'low',    'i3': 'medium', 'i4': 'high' },
                'l3': { 'i1': 'low',    'i2': 'low',    'i3': 'low',    'i4': 'medium' },
                'l4': { 'i1': 'low',    'i2': 'low',    'i3': 'low',    'i4': 'low' },
            },
        };

        const DEFAULT_CONDITIONS = [
            { id: 'c1', name: 'ACS', roleId: 'fighter-pilot', likelihoodId: 'l2', impactId: 'i3' },
            { id: 'c2', name: 'MI, SCD', roleId: 'fighter-pilot', likelihoodId: 'l3', impactId: 'i4' },
            { id: 'c3', name: 'AFIB', roleId: 'loadmaster', likelihoodId: 'l1', impactId: 'i1' },
            { id: 'c4', name: 'STROKE', roleId: 'loadmaster', likelihoodId: 'l3', impactId: 'i3' },
        ];

        class AeromedicalApp {
            constructor() {
                // Initialize State
                this.state = {
                    activeTab: 'matrix',
                    currentRoleId: DEFAULT_ROLES[0].id,
                    showReferenceTable: false,
                    isEditMode: false,
                    newConditionName: '',
                    newConditionLikelihood: DEFAULT_LIKELIHOODS[0].id,
                    newConditionImpact: DEFAULT_IMPACTS[0].id,
                    
                    // Data
                    roles: JSON.parse(JSON.stringify(DEFAULT_ROLES)),
                    likelihoods: JSON.parse(JSON.stringify(DEFAULT_LIKELIHOODS)),
                    impacts: JSON.parse(JSON.stringify(DEFAULT_IMPACTS)),
                    riskMap: JSON.parse(JSON.stringify(DEFAULT_RISK_MAP)),
                    conditions: JSON.parse(JSON.stringify(DEFAULT_CONDITIONS))
                };

                this.render();
            }

            // --- Actions ---

            setState(newState) {
                this.state = { ...this.state, ...newState };
                this.render();
            }

            setActiveTab(tab) {
                // Update UI buttons directly for instant feedback before full render
                document.getElementById('tab-matrix').className = tab === 'matrix' 
                    ? "px-4 py-2 rounded-md text-sm font-medium transition-all bg-blue-600 text-white shadow-md"
                    : "px-4 py-2 rounded-md text-sm font-medium transition-all text-slate-400 hover:text-white";
                document.getElementById('tab-settings').className = tab === 'settings' 
                    ? "px-4 py-2 rounded-md text-sm font-medium transition-all bg-blue-600 text-white shadow-md"
                    : "px-4 py-2 rounded-md text-sm font-medium transition-all text-slate-400 hover:text-white";
                
                this.setState({ activeTab: tab });
            }

            getRiskLevel(rId, lId, iId) {
                return this.state.riskMap[rId]?.[lId]?.[iId] || 'low';
            }

            cycleRiskLevel(current) {
                if (current === 'low') return 'medium';
                if (current === 'medium') return 'high';
                return 'low';
            }

            handleCellClick(lId, iId) {
                if (!this.state.isEditMode) return;
                
                const { currentRoleId, riskMap } = this.state;
                const currentLevel = this.getRiskLevel(currentRoleId, lId, iId);
                const nextLevel = this.cycleRiskLevel(currentLevel);

                // Deep copy to update
                const newMap = JSON.parse(JSON.stringify(riskMap));
                if (!newMap[currentRoleId]) newMap[currentRoleId] = {};
                if (!newMap[currentRoleId][lId]) newMap[currentRoleId][lId] = {};
                newMap[currentRoleId][lId][iId] = nextLevel;

                this.setState({ riskMap: newMap });
            }

            addCondition() {
                const { newConditionName, currentRoleId, newConditionLikelihood, newConditionImpact, conditions } = this.state;
                if (!newConditionName.trim()) return;

                const newCondition = {
                    id: Date.now().toString(),
                    name: newConditionName,
                    roleId: currentRoleId,
                    likelihoodId: newConditionLikelihood,
                    impactId: newConditionImpact
                };

                this.setState({
                    conditions: [...conditions, newCondition],
                    newConditionName: ''
                });
            }

            deleteCondition(id) {
                this.setState({
                    conditions: this.state.conditions.filter(c => c.id !== id)
                });
            }

            addRole() {
                const input = document.getElementById('quick-add-role');
                if (input && input.value) {
                    const val = input.value;
                    const newId = val.toLowerCase().replace(/\s+/g, '-');
                    
                    if (this.state.roles.some(r => r.id === newId)) {
                        alert("Role already exists");
                        return;
                    }

                    const newRoles = [...this.state.roles, { id: newId, name: val }];
                    // Initialize empty risk map for new role (optional, but good practice)
                    // The getRiskLevel handles undefined safely, so strictly not required to pre-fill.
                    
                    this.setState({
                        roles: newRoles,
                        currentRoleId: newId
                    });
                }
            }

            deleteRole(roleId, roleName) {
                if(confirm(`Are you sure you want to delete the role "${roleName}"?`)) {
                    const newRoles = this.state.roles.filter(r => r.id !== roleId);
                    // If we deleted the active role, switch to the first one available
                    let newCurrent = this.state.currentRoleId;
                    if (this.state.currentRoleId === roleId) {
                        newCurrent = newRoles[0]?.id || '';
                    }
                    this.setState({ roles: newRoles, currentRoleId: newCurrent });
                }
            }

            resetToDefaults() {
                if (confirm("Reset all data to defaults?")) {
                    this.setState({
                        roles: JSON.parse(JSON.stringify(DEFAULT_ROLES)),
                        likelihoods: JSON.parse(JSON.stringify(DEFAULT_LIKELIHOODS)),
                        impacts: JSON.parse(JSON.stringify(DEFAULT_IMPACTS)),
                        riskMap: JSON.parse(JSON.stringify(DEFAULT_RISK_MAP)),
                        conditions: JSON.parse(JSON.stringify(DEFAULT_CONDITIONS)),
                        currentRoleId: DEFAULT_ROLES[0].id
                    });
                }
            }

            // --- Render Logic ---

            getCellColorClass(level) {
                switch (level) {
                    case 'low': return 'bg-emerald-500 hover:bg-emerald-400';
                    case 'medium': return 'bg-yellow-400 hover:bg-yellow-300';
                    case 'high': return 'bg-red-600 hover:bg-red-500';
                    default: return 'bg-gray-200';
                }
            }

            getTextColorClass(level) {
                return level === 'medium' ? 'text-gray-900' : 'text-white';
            }

            render() {
                const container = document.getElementById('app-container');
                container.innerHTML = ''; // Clear

                if (this.state.activeTab === 'matrix') {
                    this.renderMatrixView(container);
                } else {
                    this.renderSettingsView(container);
                }

                // Re-initialize icons
                lucide.createIcons();
            }

            renderMatrixView(container) {
                const { roles, currentRoleId, isEditMode, impacts, likelihoods, conditions, showReferenceTable, newConditionName, newConditionLikelihood, newConditionImpact } = this.state;

                // 1. Controls Bar
                const controlsDiv = document.createElement('div');
                controlsDiv.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-6 fade-in";
                
                // Role Chips HTML
                const rolesHtml = roles.map(role => `
                    <div 
                        onclick="app.setState({currentRoleId: '${role.id}'})"
                        class="group relative flex items-center gap-2 px-4 py-2 rounded-lg border transition-all cursor-pointer select-none ${currentRoleId === role.id ? 'bg-blue-50 border-blue-500 text-blue-700 font-bold ring-2 ring-blue-100' : 'bg-white border-slate-200 text-slate-600 hover:border-slate-300'}"
                    >
                        <i data-lucide="users" class="w-4 h-4"></i>
                        ${role.name}
                        ${roles.length > 1 ? `
                        <button 
                            onclick="event.stopPropagation(); app.deleteRole('${role.id}', '${role.name}')"
                            class="ml-1 p-1 rounded-full hover:bg-red-100 text-slate-400 hover:text-red-500 transition-opacity ${currentRoleId === role.id ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}"
                            title="Delete Role"
                        >
                            <i data-lucide="trash-2" class="w-3 h-3"></i>
                        </button>` : ''}
                    </div>
                `).join('');

                controlsDiv.innerHTML = `
                    <div class="flex-1 w-full">
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Aircrew Roles</label>
                        <div class="flex flex-wrap gap-2 items-center">
                            ${rolesHtml}
                            <div class="flex items-center gap-1 pl-2 border-l border-slate-200 ml-1">
                                <input id="quick-add-role" type="text" placeholder="New Role..." 
                                    class="w-28 px-2 py-1.5 text-sm bg-slate-50 border border-slate-200 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
                                    onkeydown="if(event.key === 'Enter') app.addRole()"
                                >
                                <button onclick="app.addRole()" class="p-1.5 bg-blue-100 text-blue-600 rounded-md hover:bg-blue-200 hover:text-blue-700 transition-colors" title="Add new role">
                                    <i data-lucide="plus" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 border-l pl-6 border-slate-100">
                         <div class="text-right">
                            <p class="text-sm font-medium text-slate-900">Matrix Edit Mode</p>
                            <p class="text-xs text-slate-500">Click cells to change risk</p>
                         </div>
                         <button onclick="app.setState({isEditMode: !app.state.isEditMode})" class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 ${isEditMode ? 'bg-blue-600' : 'bg-slate-200'}">
                            <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${isEditMode ? 'translate-x-6' : 'translate-x-1'}"></span>
                         </button>
                    </div>
                `;
                container.appendChild(controlsDiv);

                // 2. Grid Layout
                const gridLayout = document.createElement('div');
                gridLayout.className = "grid grid-cols-1 lg:grid-cols-4 gap-6 fade-in";
                
                // Matrix Column
                const matrixCol = document.createElement('div');
                matrixCol.className = "lg:col-span-3 space-y-4";
                
                // Construct Grid HTML
                const headerHtml = impacts.map(impact => `
                    <div class="text-center px-2 group relative">
                        <div class="font-bold text-slate-800 flex items-center justify-center gap-1 cursor-help">
                            ${impact.label}
                            <i data-lucide="info" class="w-3 h-3 text-slate-400"></i>
                        </div>
                        <div class="absolute z-10 bottom-full mb-2 left-1/2 -translate-x-1/2 w-64 bg-slate-800 text-white text-xs text-left p-3 rounded shadow-xl opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
                            <div class="mb-2"><strong>Mission:</strong> ${impact.missionImpact}</div>
                            <div class="mb-2"><strong>Crew:</strong> ${impact.crewImpact}</div>
                            <div><strong>Medical:</strong> ${impact.medicalImpact}</div>
                            <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-2 h-2 bg-slate-800 rotate-45"></div>
                        </div>
                    </div>
                `).join('');

                const rowsHtml = likelihoods.map(lik => {
                    const cellsHtml = impacts.map(imp => {
                        const level = this.getRiskLevel(currentRoleId, lik.id, imp.id);
                        const cellConds = conditions.filter(c => c.roleId === currentRoleId && c.likelihoodId === lik.id && c.impactId === imp.id);
                        
                        return `
                            <div 
                                onclick="app.handleCellClick('${lik.id}', '${imp.id}')"
                                class="relative h-32 rounded-lg border-2 border-transparent transition-all p-2 flex flex-col gap-1 overflow-y-auto ${this.getCellColorClass(level)} ${isEditMode ? 'cursor-pointer hover:scale-[1.02] hover:shadow-md' : ''}"
                            >
                                ${cellConds.map(c => `
                                    <div class="bg-white/90 backdrop-blur-sm text-slate-900 text-xs font-semibold px-2 py-1 rounded shadow-sm flex justify-between items-center group">
                                        <span>${c.name}</span>
                                        ${isEditMode ? `<button onclick="event.stopPropagation(); app.deleteCondition('${c.id}')" class="text-slate-400 hover:text-red-500 ml-1"><i data-lucide="trash-2" class="w-3 h-3"></i></button>` : ''}
                                    </div>
                                `).join('')}
                                <div class="absolute bottom-1 right-2 text-[10px] font-bold opacity-30 uppercase ${this.getTextColorClass(level)}">
                                    ${level}
                                </div>
                            </div>
                        `;
                    }).join('');

                    return `
                        <div class="grid grid-cols-5 gap-4">
                            <div class="col-span-1 flex flex-col justify-center pr-4 border-r border-slate-100">
                                <span class="font-bold text-slate-800 text-sm">${lik.label}</span>
                                <span class="text-xs text-slate-500">${lik.subLabel}</span>
                            </div>
                            ${cellsHtml}
                        </div>
                    `;
                }).join('');

                matrixCol.innerHTML = `
                    <div class="bg-white p-6 rounded-xl shadow-lg border border-slate-200 overflow-x-auto">
                        <div class="min-w-[700px]">
                            <div class="grid grid-cols-5 mb-4">
                                <div class="col-span-1"></div>
                                ${headerHtml}
                            </div>
                            <div class="space-y-4">
                                ${rowsHtml}
                            </div>
                        </div>
                    </div>
                    
                    <!-- Reference Table -->
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <button onclick="app.setState({showReferenceTable: !app.state.showReferenceTable})" class="w-full flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100 text-left font-medium text-slate-700">
                             <span class="flex items-center gap-2"><i data-lucide="info" class="w-4 h-4"></i> Class Definition Reference Table</span>
                             <i data-lucide="${showReferenceTable ? 'chevron-up' : 'chevron-down'}" class="w-4 h-4"></i>
                        </button>
                        ${showReferenceTable ? `
                            <div class="p-4 overflow-x-auto">
                                <table class="w-full text-sm text-left text-slate-600 border-collapse">
                                    <thead class="text-xs text-slate-700 uppercase bg-slate-100">
                                        <tr>
                                            <th class="px-4 py-3 rounded-tl-lg">Class</th>
                                            <th class="px-4 py-3">Mission Impact</th>
                                            <th class="px-4 py-3">Medical / Crew Impact</th>
                                            <th class="px-4 py-3 rounded-tr-lg">Medical Requirements</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${impacts.map(i => `
                                            <tr class="border-b border-slate-100 last:border-0 hover:bg-slate-50">
                                                <td class="px-4 py-3 font-bold text-slate-900 whitespace-nowrap align-top">${i.label}</td>
                                                <td class="px-4 py-3 align-top">${i.missionImpact}</td>
                                                <td class="px-4 py-3 align-top">${i.medicalImpact}</td>
                                                <td class="px-4 py-3 align-top">${i.crewImpact}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        ` : ''}
                    </div>
                `;

                // Sidebar Column
                const sidebarCol = document.createElement('div');
                sidebarCol.className = "lg:col-span-1 space-y-6";
                sidebarCol.innerHTML = `
                    <div class="bg-white p-5 rounded-xl shadow-md border border-slate-200">
                        <div class="flex items-center gap-2 mb-4 border-b border-slate-100 pb-3">
                            <i data-lucide="plus" class="w-5 h-5 text-blue-600"></i>
                            <h3 class="font-bold text-slate-800">Add Medical Event</h3>
                        </div>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-500 mb-1">Condition Name</label>
                                <input type="text" id="new-cond-name" value="${newConditionName}" 
                                    class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="e.g. Tachycardia"
                                    oninput="app.state.newConditionName = this.value"
                                >
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 mb-1">Likelihood</label>
                                    <select onchange="app.state.newConditionLikelihood = this.value" class="w-full px-2 py-2 border border-slate-300 rounded-md text-sm">
                                        ${likelihoods.map(l => `<option value="${l.id}" ${l.id === newConditionLikelihood ? 'selected' : ''}>${l.label}</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 mb-1">Impact</label>
                                    <select onchange="app.state.newConditionImpact = this.value" class="w-full px-2 py-2 border border-slate-300 rounded-md text-sm">
                                        ${impacts.map(i => `<option value="${i.id}" ${i.id === newConditionImpact ? 'selected' : ''}>${i.label}</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                            <button onclick="app.addCondition()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md transition-colors flex justify-center items-center gap-2">
                                <i data-lucide="save" class="w-4 h-4"></i> Add to Matrix
                            </button>
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                        <h4 class="font-bold text-sm text-slate-800 mb-3">Risk Assessment Legend</h4>
                        <div class="space-y-2 text-sm">
                            <div class="flex items-center gap-3"><div class="w-6 h-6 rounded bg-emerald-500"></div><span class="text-slate-600">Acceptable Risk (Monitoring)</span></div>
                            <div class="flex items-center gap-3"><div class="w-6 h-6 rounded bg-yellow-400"></div><span class="text-slate-600">Moderate Risk (Waiver Req.)</span></div>
                            <div class="flex items-center gap-3"><div class="w-6 h-6 rounded bg-red-600"></div><span class="text-slate-600">Unacceptable Risk (Grounding)</span></div>
                        </div>
                    </div>
                `;

                gridLayout.appendChild(matrixCol);
                gridLayout.appendChild(sidebarCol);
                container.appendChild(gridLayout);
            }

            renderSettingsView(container) {
                const { impacts, likelihoods } = this.state;
                
                const settingsDiv = document.createElement('div');
                settingsDiv.className = "bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden fade-in";
                
                // Helper to update impact array safely
                window.updateImpact = (idx, field, val) => {
                    const newImpacts = [...this.state.impacts];
                    newImpacts[idx][field] = val;
                    this.setState({ impacts: newImpacts });
                };

                 // Helper to update likelihood array safely
                 window.updateLikelihood = (idx, field, val) => {
                    const newLiks = [...this.state.likelihoods];
                    newLiks[idx][field] = val;
                    this.setState({ likelihoods: newLiks });
                };

                settingsDiv.innerHTML = `
                    <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900">System Configuration</h2>
                            <p class="text-slate-500 text-sm">Customize axes definitions (Rows & Columns).</p>
                        </div>
                        <button onclick="app.resetToDefaults()" class="text-red-600 hover:bg-red-50 px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-2">
                            <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset Defaults
                        </button>
                    </div>
                    <div class="p-6 space-y-8">
                        <!-- Impact Config -->
                        <section>
                            <div class="flex items-center gap-2 mb-4">
                                <i data-lucide="alert-triangle" class="w-5 h-5 text-slate-400"></i>
                                <h3 class="font-bold text-slate-800">Class Definitions (Impact Columns)</h3>
                            </div>
                            <div class="grid grid-cols-1 gap-6">
                                ${impacts.map((imp, idx) => `
                                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                                        <div class="flex items-center gap-2 mb-3">
                                            <span class="bg-slate-200 text-slate-600 px-2 py-1 rounded text-xs font-bold">Column ${idx + 1}</span>
                                            <input value="${imp.label}" oninput="updateImpact(${idx}, 'label', this.value)" class="font-bold text-slate-800 bg-transparent border-b border-slate-300 focus:border-blue-500 focus:outline-none">
                                        </div>
                                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            <div>
                                                <label class="text-xs font-semibold text-slate-500 uppercase">Mission Impact</label>
                                                <textarea oninput="updateImpact(${idx}, 'missionImpact', this.value)" class="w-full mt-1 p-2 text-sm border rounded h-24 resize-none focus:ring-1 focus:ring-blue-500">${imp.missionImpact}</textarea>
                                            </div>
                                            <div>
                                                <label class="text-xs font-semibold text-slate-500 uppercase">Medical Impact</label>
                                                <textarea oninput="updateImpact(${idx}, 'medicalImpact', this.value)" class="w-full mt-1 p-2 text-sm border rounded h-24 resize-none focus:ring-1 focus:ring-blue-500">${imp.medicalImpact}</textarea>
                                            </div>
                                            <div>
                                                <label class="text-xs font-semibold text-slate-500 uppercase">Crew/Requirements</label>
                                                <textarea oninput="updateImpact(${idx}, 'crewImpact', this.value)" class="w-full mt-1 p-2 text-sm border rounded h-24 resize-none focus:ring-1 focus:ring-blue-500">${imp.crewImpact}</textarea>
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </section>

                        <!-- Likelihood Config -->
                        <section class="border-t border-slate-100 pt-8">
                            <div class="flex items-center gap-2 mb-4">
                                <i data-lucide="shield-alert" class="w-5 h-5 text-slate-400"></i>
                                <h3 class="font-bold text-slate-800">Likelihood Definitions (Rows)</h3>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                ${likelihoods.map((lik, idx) => `
                                    <div class="flex gap-2 items-start bg-slate-50 p-3 rounded border border-slate-200">
                                        <span class="text-slate-400 font-mono mt-2 font-bold">${idx + 1}</span>
                                        <div class="flex-1 space-y-1">
                                            <input value="${lik.label}" oninput="updateLikelihood(${idx}, 'label', this.value)" class="w-full p-1 text-sm font-bold bg-transparent border-b border-transparent hover:border-slate-300 focus:border-blue-500">
                                            <input value="${lik.subLabel}" oninput="updateLikelihood(${idx}, 'subLabel', this.value)" class="w-full p-1 text-sm text-slate-500 bg-transparent border-b border-transparent hover:border-slate-300 focus:border-blue-500">
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    </div>
                `;

                container.appendChild(settingsDiv);
            }
        }

        // Init App
        const app = new AeromedicalApp();
    </script>
</body>
</html>
